<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Display Book</title>
    <style>
        .container {
            width: 380px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid black;
        }

        label {
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 6px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        #bookDetails {
            display: none;
            border-top: 1px solid grey;
            padding-top: 10px;
        }

        #bookDetails p {
            margin: 6px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Book Records</h2>

        <label for="bookSelect">Select Book Title:</label>
        <select id="bookSelect">
            <option value="">-- Please Select a Book --</option>
        </select>

        <div id="bookDetails">
            <p><strong>Title: </strong><span id="bookTitle"></span></p>
            <p><strong>Author: </strong><span id="bookAuthor"></span></p>
            <p><strong>Publication Year: </strong><span id="bookYear"></span></p>
            <p><strong>Genre: </strong><span id="bookGenre"></span></p>
        </div>
    </div>

    <script>
        let bookList = [];

        async function loadBooks() {
            try {
                let response = await fetch("https://raw.githubusercontent.com/elysacd/WDLab6-books/main/books.json");
                
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                let data = await response.json();
                
                // Get the books array from JSON
                bookList = data.Books || data.books;

                // Populate select dropdown options
                let select = document.getElementById("bookSelect");
                for (let i = 0; i < bookList.length; i++) {
                    let option = document.createElement("option");
                    option.value = bookList[i].title;
                    option.innerText = bookList[i].title;
                    select.appendChild(option);
                }
            } catch (error) {
                console.log(error);
            }
        }

        // Call fetch function when script runs
        loadBooks();

        // Event listener for dropdown change
        let bookSelect = document.getElementById("bookSelect");
        bookSelect.addEventListener("change", function () {
            let selectedTitle = bookSelect.value;
            let detailsDiv = document.getElementById("bookDetails");

            if (selectedTitle === "") {
                detailsDiv.style.display = "none";
                return;
            }

            // Loop through array to find the matching book record
            for (let i = 0; i < bookList.length; i++) {
                if (bookList[i].title === selectedTitle) {
                    document.getElementById("bookTitle").innerText = bookList[i].title;
                    document.getElementById("bookAuthor").innerText = bookList[i].author;
                    document.getElementById("bookYear").innerText = bookList[i].publicationYear;
                    document.getElementById("bookGenre").innerText = bookList[i].genres.join(", ");
                    detailsDiv.style.display = "block";
                    break;
                }
            }
        });
    </script>
</body>
</html>
